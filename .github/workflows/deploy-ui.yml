name: Deploy UI to Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  WEB_DIR: web

jobs:
  deploy:
    name: Build & Deploy Next.js UI
    runs-on: windows-latest
    environment: production

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: ${{ env.WEB_DIR }}
        run: npm ci

      # ── 4. Build Next.js ──────────────────────────────────────────────────────
      #   .env.production is committed and sets NEXT_PUBLIC_API_URL automatically.
      #   The secret overrides it if set, allowing per-environment CI overrides.
      - name: Build Next.js (production)
        working-directory: ${{ env.WEB_DIR }}
        env:
          NODE_ENV: production
        run: npm run build

      # ── 5. Assemble standalone package ───────────────────────────────────────
      #   next build (with output:'standalone') creates .next/standalone/ which
      #   contains a minimal node_modules + server.js — no full node_modules
      #   deploy needed.  We then copy the static/public assets alongside it.
      - name: Assemble standalone package
        shell: pwsh
        working-directory: ${{ env.WEB_DIR }}
        run: |
          $standalone = ".next\standalone"
          # Static client assets (/_next/static/...)
          Copy-Item -Recurse -Force ".next\static" "$standalone\.next\static"
          # public/ folder (not present yet but future-safe)
          if (Test-Path "public") {
            Copy-Item -Recurse -Force "public" "$standalone\public"
          }
          Write-Host "Standalone package assembled."

      # ── 6. Write web.config for IISNode ──────────────────────────────────────
      #   Goes into .next/standalone — that is what we deploy.
      - name: Write web.config
        shell: pwsh
        run: |
          $webConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <handlers>
                <add name="iisnode" path="server.js" verb="*" modules="iisnode" />
              </handlers>
              <rewrite>
                <rules>
                  <rule name="NextJS" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="server.js" />
                  </rule>
                </rules>
              </rewrite>
              <iisnode
                nodeProcessCommandLine="node.exe --preserve-symlinks --preserve-symlinks-main"
                loggingEnabled="true"
                logDirectory="iisnode"
                devErrorsEnabled="false"
                debuggingEnabled="false" />
              <security>
                <requestFiltering>
                  <hiddenSegments>
                    <add segment="node_modules" />
                    <add segment=".next" />
                    <add segment=".env" />
                    <add segment=".env.local" />
                  </hiddenSegments>
                </requestFiltering>
              </security>
            </system.webServer>
          </configuration>
          '@
          Set-Content -Path "${{ github.workspace }}\${{ env.WEB_DIR }}\.next\standalone\web.config" -Value $webConfig -Encoding UTF8
          Write-Host "web.config written."

      # ── 7. Overwrite standalone server.js ────────────────────────────────────
      #   Next.js standalone generates server.js with parseInt(PORT) which
      #   returns NaN when IISNode passes a named-pipe path in PORT.
      #   We replace it so PORT is passed directly to .listen(), which accepts
      #   both TCP port numbers and Windows named-pipe paths.
      - name: Overwrite server.js for IISNode named-pipe support
        shell: pwsh
        run: |
          $serverJs = @'
          'use strict';
          const path    = require('path');
          const http    = require('http');
          const { parse } = require('url');
          const next    = require(path.join(__dirname, 'node_modules', 'next'));

          const dev    = false;
          // IISNode sets PORT to a named-pipe path (e.g. \\.\pipe\...)
          // Do NOT parseInt — pass the value directly so http.Server can bind
          // to either a TCP port number or a named pipe.
          const port   = process.env.PORT || 3000;
          const app    = next({ dev, dir: __dirname });
          const handle = app.getRequestHandler();

          app.prepare().then(() => {
            http.createServer((req, res) => {
              const parsedUrl = parse(req.url, true);
              handle(req, res, parsedUrl);
            }).listen(port, (err) => {
              if (err) throw err;
              console.log('> Ready on ' + port);
            });
          }).catch((err) => {
            console.error('Failed to start Next.js:', err);
            process.exit(1);
          });
          '@
          Set-Content -Path "${{ github.workspace }}\${{ env.WEB_DIR }}\.next\standalone\server.js" -Value $serverJs -Encoding UTF8
          Write-Host "server.js overwritten for IISNode named-pipe support."

      # ── 8. Create iisnode log directory ──────────────────────────────────────
      - name: Create iisnode log dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\${{ env.WEB_DIR }}\.next\standalone\iisnode" | Out-Null
          Write-Host "iisnode/ directory created."

      # ── 8. Deploy via Web Deploy (MSDeploy) ───────────────────────────────────
      #   Deploy only .next/standalone — self-contained, no full node_modules.
      - name: Deploy via Web Deploy (MSDeploy)
        shell: pwsh
        env:
          MSDEPLOY_PASSWORD: ${{ secrets.MSDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            Write-Host "MSDeploy not found – installing via Chocolatey..."
            choco install webdeploy --no-progress -y | Out-Null
          }

          $publishDir = "${{ github.workspace }}\${{ env.WEB_DIR }}\.next\standalone"

          $destLine  = "contentPath=rajibmahata143-001-site2"
          $destLine += ",computerName=https://win1069.site4now.net:8172/msdeploy.axd?site=rajibmahata143-001-site2"
          $destLine += ",userName=rajibmahata143-001"
          $destLine += ",password=$env:MSDEPLOY_PASSWORD"
          $destLine += ",authtype=Basic"
          $destLine += ",includeAcls=False"

          $msArgs = @(
            '-verb:sync',
            "-source:contentPath=$publishDir",
            "-dest:$destLine",
            '-allowUntrusted',
            '-enableRule:AppOffline',
            '-retryAttempts:3',
            '-retryInterval:2000'
          )

          & $msdeploy @msArgs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSDeploy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Deployment successful → http://rajibmahata143-001-site2.mtempurl.com/"

