name: Deploy API to Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  PROJECT: src/DocumentSigning.Api/DocumentSigning.Api.csproj

jobs:
  deploy:
    name: Build & Deploy API
    runs-on: windows-latest
    environment: production

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. .NET setup ────────────────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── 3. Restore ───────────────────────────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT }}

      # ── 4. Publish ───────────────────────────────────────────────────────────
      - name: Publish (Release)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -o "${{ github.workspace }}\publish"
          --no-restore

      # ── 5. Inject production appsettings ─────────────────────────────────────
      #   Store the full JSON contents of appsettings.Production.json as a
      #   GitHub Actions secret named PROD_APPSETTINGS_JSON.
      - name: Write appsettings.Production.json
        shell: pwsh
        env:
          PROD_APPSETTINGS: ${{ secrets.PROD_APPSETTINGS_JSON }}
        run: |
          Set-Content `
            -Path "${{ github.workspace }}\publish\appsettings.Production.json" `
            -Value $env:PROD_APPSETTINGS `
            -Encoding UTF8
          Write-Host "appsettings.Production.json written."

      # ── 6. Set ASPNETCORE_ENVIRONMENT=Production in web.config ───────────────
      - name: Patch web.config – set Production environment
        shell: pwsh
        run: |
          $path = "${{ github.workspace }}\publish\web.config"
          if (-not (Test-Path $path)) {
            Write-Warning "web.config not found – skipping patch."
            exit 0
          }

          [xml]$xml = Get-Content $path -Raw
          $aspNetCore = $xml.SelectSingleNode("//aspNetCore")
          if ($null -eq $aspNetCore) {
            Write-Warning "aspNetCore element not found – skipping patch."
            exit 0
          }

          # Ensure <environmentVariables> exists
          $envVars = $aspNetCore.SelectSingleNode("environmentVariables")
          if ($null -eq $envVars) {
            $envVars = $xml.CreateElement("environmentVariables")
            $aspNetCore.AppendChild($envVars) | Out-Null
          }

          # Upsert ASPNETCORE_ENVIRONMENT
          $existing = $envVars.SelectSingleNode("environmentVariable[@name='ASPNETCORE_ENVIRONMENT']")
          if ($null -ne $existing) {
            $existing.SetAttribute("value", "Production")
          } else {
            $el = $xml.CreateElement("environmentVariable")
            $el.SetAttribute("name",  "ASPNETCORE_ENVIRONMENT")
            $el.SetAttribute("value", "Production")
            $envVars.AppendChild($el) | Out-Null
          }

          $xml.Save($path)
          Write-Host "web.config patched: ASPNETCORE_ENVIRONMENT=Production"

      # ── 7. MSDeploy ──────────────────────────────────────────────────────────
      - name: Deploy via Web Deploy (MSDeploy)
        shell: pwsh
        env:
          MSDEPLOY_PASSWORD: ${{ secrets.MSDEPLOY_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            Write-Host "MSDeploy not found – installing via Chocolatey..."
            choco install webdeploy --no-progress -y | Out-Null
          }

          $publishDir = "${{ github.workspace }}\publish"

          # Build the dest value without inner quotes.
          # Embedding quotes inside a string passed to a native exe breaks PowerShell
          # argument quoting. MSDeploy does not require quotes around parameter values.
          $destLine  = "contentPath=rajibmahata143-001-subsite3"
          $destLine += ",computerName=https://win1069.site4now.net:8172/msdeploy.axd?site=rajibmahata143-001-subsite3"
          $destLine += ",userName=rajibmahata143-001"
          $destLine += ",password=$env:MSDEPLOY_PASSWORD"
          $destLine += ",authtype=Basic"
          $destLine += ",includeAcls=False"

          # Use argument splatting so each flag is a separate, clean argument.
          $msArgs = @(
            '-verb:sync',
            "-source:contentPath=$publishDir",
            "-dest:$destLine",
            '-allowUntrusted',
            '-enableRule:AppOffline',
            '-retryAttempts:3',
            '-retryInterval:2000'
          )

          & $msdeploy @msArgs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSDeploy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Deployment successful → http://api.docsignerhub.com/"
